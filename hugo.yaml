  title: "Jonathan Ambrose"
  description: "Soft robotics PhD. CTO and co-founder of Seamless XR. Notes on building sensory diagnostics, haptics, and hardware."
  keywords: [soft robotics, haptics, healthcare, Seamless XR, 3D printing, travel]
  author: "Jonathan Ambrose"
  email: "ambrose.mods@gmail.com"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
