baseURL: "https://jwambrose.com/"
title: "Jonathan Ambrose"
theme: PaperMod
languageCode: en-us
enableRobotsTXT: true
buildDrafts: false

pagination:
  pagerSize: 8

minify:
  disableXML: true

params:
  env: production
  title: "Jonathan Ambrose"
  description: "Jonathan Ambrose — medtech founder, soft robotics PhD, and CTO of Seamless XR. Building AI-guided sensory diagnostics for clinicians."
  keywords: [Jonathan Ambrose, Seamless XR, medtech founder, soft robotics, haptics, healthcare, sensory diagnostics, CTO]
  author: "Jonathan Ambrose"
  email: "ambrose.mods@gmail.com"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowToc: false
  hideFooter: false
  DateFormat: "January 2, 2006"

  images:
    - /images/cover.jpg

  assets:
    favicon: "favicon.svg"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
    safari_pinned_tab: "safari-pinned-tab.svg"

  label:
    text: "Jonathan Ambrose"
    # JA mark, inlined so it follows the light/dark toggle (colours live in custom.css)
    iconSVG: '<svg class="logo-mark" viewBox="2.5 7.5 57 49" width="35" height="30" aria-hidden="true" focusable="false"><path class="logo-j" d="M20.5 8H38L26 56H3L6.25 43H14.75L13.25 49H19.25L27.75 15H18.75Z"/><path class="logo-a" fill-rule="evenodd" d="M37 8H47L59 56H50.5L47.5 44H36.5L33.5 56H25ZM42 22L45.75 37H38.25Z"/></svg>'

  homepage:
    kicker: "Medtech founder · CTO · Soft robotics PhD"
    lede: >
      CTO and co-founder of [Seamless XR](https://seamless.sg).
      I build haptic and sensory systems so clinicians can measure what patients can feel — and so people can get that feeling back.

