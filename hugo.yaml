baseURL: "https://jwambrose.com/"
title: "Jonathan Ambrose"
theme: PaperMod
languageCode: en-us
enableRobotsTXT: true
buildDrafts: false

pagination:
  pagerSize: 8

minify:
  disableXML: true

params:
  env: production
  title: "Jonathan Ambrose"
  description: "Soft robotics PhD, CTO of Seamless XR. Travel notes, 3D prints, and building in healthcare."
  keywords: [blog, travel, 3D printing, soft robotics, maker, healthcare, Seamless XR]
  author: "Jonathan Ambrose"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowToc: false
  hideFooter: false
  DateFormat: "January 2, 2006"

  # Full-page personal home (PaperMod profile mode)
  profileMode:
    enabled: true
    title: "Jonathan Ambrose"
    subtitle: >
      Soft robotics PhD · CTO & co-founder at [Seamless XR](https://seamless.sg).
      I write about travel, 3D printing, and building things that help people feel again.
    imageUrl: "" # drop a square photo at static/images/profile.jpg and set "/images/profile.jpg"
    imageWidth: 160
    imageHeight: 160
    buttons:
      - name: Blog
        url: "/posts/"
      - name: Prints
        url: "/prints/"
      - name: About
        url: "/about/"
      - name: Seamless XR
        url: "https://seamless.sg"

  socialIcons:
    - name: github
      url: "https://github.com/Ambrosemods/"
    - name: linkedin
      url: "https://linkedin.com/in/jwa"
    - name: rss
      url: "/index.xml"

menu:
  main:
    - identifier: blog
      name: Blog
      url: /posts/
      weight: 10
    - identifier: prints
      name: Prints
      url: /prints/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30

outputs:
  home:
    - HTML
    - RSS
    - JSON
