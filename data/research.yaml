intro: >
  Soft robotics PhD at NUS, in Raye Yeow's Evolution Innovation Lab.
  I designed multilayer pneumatic actuators — compact artificial muscles
  that extend, contract, and stack — for wearable haptics and robots
  you can reconfigure. That hardware became a family of patents, then
  [Seamless XR](https://seamless.sg).

