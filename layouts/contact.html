{{ define "main" }}
<article class="contact">
  <header class="contact-hero">
    <p class="home-kicker">Get in touch</p>
    <h1>Contact me</h1>
    <p class="home-lede">Work, press, or collaboration. I’ll get back to you by email.</p>
  </header>

  <form class="contact-form" action="https://formsubmit.co/ambrose.mods@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="jwambrose.com contact">
    <input type="hidden" name="_template" value="table">
    <input type="text" name="_honey" class="contact-honey" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="contact-row">
      <label class="contact-field">
        <span class="contact-label">Name</span>
        <input type="text" name="name" placeholder="Name" required autocomplete="name">
      </label>
      <label class="contact-field">
        <span class="contact-label">Email</span>
        <input type="email" name="email" placeholder="Email" required autocomplete="email">
      </label>
    </div>

    <label class="contact-field">
      <span class="contact-label">Message</span>
      <textarea name="message" placeholder="Message" rows="8" required></textarea>
    </label>

    <button class="contact-send" type="submit">Send</button>
  </form>
</article>
{{ end }}
