{{ define "main" }}
<article class="contact">
  <header class="contact-hero">
    <h1 class="page-title">Contact me</h1>
    <p class="lede">Work, press, or collaboration. I’ll get back to you by email.</p>
  </header>

  <form class="contact-form" action="https://formsubmit.co/ambrose.mods@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="jwambrose.com contact">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="{{ "contact/thanks/" | absURL }}">
    <input type="text" name="_honey" class="contact-honey" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="contact-row">
      <label class="contact-field">
        <span class="contact-label">Name</span>
        <input type="text" name="name" placeholder="Your name" required autocomplete="name">
      </label>
      <label class="contact-field">
        <span class="contact-label">Email</span>
        <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </label>
    </div>

    <label class="contact-field">
      <span class="contact-label">Message</span>
      <textarea name="message" placeholder="What would you like to talk about?" rows="8" required></textarea>
    </label>

    <button class="btn btn-primary contact-send" type="submit">Send message</button>
  </form>

  <p class="contact-alt">
    Prefer LinkedIn? <a href="https://www.linkedin.com/in/jwa" rel="noopener">Message me there</a>.
  </p>
</article>
{{ end }}
