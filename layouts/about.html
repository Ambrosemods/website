{{ define "main" }}
<article class="about">
  <header class="about-hero">
    {{- with resources.Get "images/headshot.jpg" }}
    {{- $img := .Resize "240x240 q82" }}
    <img class="about-avatar" src="{{ $img.RelPermalink }}" width="120" height="120" alt="Portrait of {{ site.Params.author }}">
    {{- end }}
    <h1 class="page-title">{{ .Params.heading | default .Title }}</h1>
  </header>

  <div class="about-body post-content md-content">
    {{ .Content }}
  </div>

  {{- with site.Params.profiles }}
  <footer class="about-links">
    <h2 class="label">Elsewhere</h2>
    <p class="actions">
      {{- range . }}
      <a class="btn" href="{{ .url }}" rel="noopener me">{{ .name }}</a>
      {{- end }}
      <a class="btn" href="https://seamless.sg" rel="noopener">Seamless XR</a>
    </p>
  </footer>
  {{- end }}
</article>
{{ end }}
